<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书商店 - Spring Boot Demo 1</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>📚 图书商店 Bookstore</h1>
        <p class="sub">Spring Boot 三层架构 + REST + 前端打通 Demo</p>
    </header>

    <main>
        <!-- 左侧：新增表单 -->
        <section class="card form-card">
            <h2>新增图书</h2>
            <form id="book-form">
                <label>
                    书名
                    <input type="text" id="title" name="title" placeholder="例如：Spring 实战" required>
                </label>
                <label>
                    作者
                    <input type="text" id="author" name="author" placeholder="例如：张伟" required>
                </label>
                <label>
                    价格
                    <input type="number" id="price" name="price" step="0.01" min="0" placeholder="例如：88.5" required>
                </label>
                <button type="submit">新增</button>
            </form>
            <p id="form-msg" class="msg"></p>
        </section>

        <!-- 右侧：图书列表 -->
        <section class="card list-card">
            <h2>图书列表 <span id="count" class="count"></span></h2>
            <div class="search-bar">
                <input type="text" id="search-input" placeholder="按书名搜索...">
                <button id="search-btn" type="button">搜索</button>
                <button id="clear-btn" type="button" class="ghost">显示全部</button>
            </div>
            <ul id="book-list" class="book-list">
                <li class="empty">加载中...</li>
            </ul>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
